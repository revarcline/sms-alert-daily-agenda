[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sms-alert-daily-agenda"
version = "0.1.0rc2"
description = "Send your daily Google Calendar agenda via SMS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-auth>=2.22.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-api-python-client>=2.88.0",
]

[project.scripts]
daily-agenda = "sms_alert_daily_agenda.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sms_alert_daily_agenda"]
